version: "3.9"

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: linkedin_ai_postgres_dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: linkedin_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: linkedin_agent_dev
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: password123
      DB_NAME: linkedin_ai
      NODE_ENV: development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    command: ["sh", "-c", "./scripts/wait-for-db.sh postgres 5432 npm run dev"]

volumes:
  pgdata_dev:
